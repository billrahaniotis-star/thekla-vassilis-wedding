<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Βασίλης και Θέκλα</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #f9f4e5;
      min-height: 100vh;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .page {
      position: relative;
      width: min(100vw, 680px);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #f9f4e5;
    }
    .bg, .element {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      left: 0;
      top: 0;
    }
    .element {
      object-fit: contain;
    }
    .name-area-cleanup {
      position: absolute;
      left: 0;
      top: 17%;
      width: 15%;
      height: 18%;
      background: #f9f4e5;
      z-index: 1;
      pointer-events: none;
    }
    .rings { left: 27%; top: 9%; width: 46%; height: 9%; }
    .names { left: 5%; top: 18%; width: 90%; height: 15%; }
    .slogan { left: 9%; top: 31%; width: 82%; height: 9%; }
    .divider { left: 24%; top: 40.5%; width: 52%; height: 6%; }
    .instruction {
      position: absolute;
      left: 8%;
      top: 44%;
      width: 84%;
      text-align: center;
      font: italic 600 clamp(18px, 4.2vw, 28px)/1.3 Georgia, serif;
      color: #637c6b;
    }
    .counter {
      position: absolute;
      left: 12%;
      top: 53%;
      width: 76%;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      font: 22px Georgia, serif;
      color: #665b49;
    }
    .counter span {
      white-space: nowrap;
    }
    .counter:before, .counter:after {
      content: "";
      height: 1px;
      flex: 1;
      background: #c39a4d;
    }
    .actions {
      position: absolute;
      left: 7%;
      top: 59%;
      width: 86%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .upload {
      height: 54px;
      border: 1.5px solid #c49a4c;
      border-radius: 40px;
      background: rgba(255, 252, 244, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #63786a;
      font: 500 clamp(17px, 4vw, 26px) Georgia, serif;
      box-shadow: 0 5px 14px rgba(120, 90, 40, 0.07);
      cursor: pointer;
    }
    .upload:active {
      transform: scale(0.99);
    }
    input {
      display: none;
    }
    .icon {
      width: 32px;
      height: 32px;
      color: #b88b37;
    }
    .icon svg {
      width: 31px;
      height: 31px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .gallery-title {
      position: absolute;
      text-align: center;
      color: #7b6b52;
      font: 600 13px Georgia, serif;
      letter-spacing: 2px;
    }
    .photo-title { left: 7%; top: 76.5%; width: 86%; }
    .video-title { left: 7%; top: 86.5%; width: 86%; }
    .gallery {
      position: absolute;
      left: 10%;
      width: 80%;
      display: grid;
      gap: 8px;
    }
    .photo-gallery {
      top: 78%;
      height: 5.7%;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }
    .video-gallery {
      top: 88%;
      height: 3.6%;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 1fr;
    }
    .slot {
      border: 1.2px solid rgba(196, 154, 76, 0.75);
      border-radius: 7px;
      overflow: hidden;
      background: rgba(255, 252, 244, 0.35);
      position: relative;
    }
    .slot img, .slot video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .play {
      position: absolute;
      right: 5%;
      bottom: 5%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      color: #a77c2e;
      display: grid;
      place-items: center;
      font-size: 9px;
    }
    .status {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 93.2%;
      z-index: 20;
      text-align: center;
      font: 13px Georgia, serif;
      color: #637c6b;
      min-height: 20px;
    }
    .send {
      position: absolute;
      left: 16%;
      top: 95.2%;
      width: 68%;
      height: 4.1%;
      border: 1.5px solid #c49a4c;
      border-radius: 28px;
      background: #fffdf4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #665b49;
      font: 700 21px Georgia, serif;
      box-shadow: 0 5px 14px rgba(120, 90, 40, 0.07);
      cursor: pointer;
      z-index: 50;
    }
    .send:active {
      transform: scale(0.99);
    }
    .send:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .thankyou {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 61%;
      display: none;
      text-align: center;
      padding: 10px 18px;
      color: #637c6b;
      font: italic 600 clamp(16px, 4vw, 22px)/1.3 Georgia, serif;
      z-index: 10;
    }
    .thankyou.show {
      display: block;
    }

    @media (max-width: 430px) {
      .upload {
        height: 52px;
        font-size: 18px;
      }
      .gallery {
        gap: 4px;
      }
      .slot {
        border-radius: 6px;
      }
      .gallery-title {
        font-size: 11px;
        letter-spacing: 1.5px;
      }
      .status {
        font-size: 12px;
      }
      .send {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

    <div id="thankyou" class="thankyou">
