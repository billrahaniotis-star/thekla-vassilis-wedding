<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Βασίλης και Θέκλα</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#f6f1e6;
    color:#51483e;
    font-family:"Cormorant Garamond",Georgia,serif;
}

/* PAGE */

.page{
    position:relative;

    width:calc(100% - 22px);
    max-width:600px;

    min-height:calc(100vh - 22px);

    margin:11px auto;

    background:#fcfaf4;

    border:1px solid #b9934f;

    overflow:hidden;
}

/* INNER GOLD BORDER */

.page:before{
    content:"";

    position:absolute;

    left:7px;
    right:7px;
    top:7px;
    bottom:7px;

    border:1px solid rgba(185,147,79,.55);

    pointer-events:none;
}

/* BOTANICALS */

.botanical{
    position:absolute;

    width:230px;
    height:230px;

    z-index:1;

    pointer-events:none;
}

.top-left{
    top:-12px;
    left:-18px;
}

.bottom-right{
    right:-18px;
    bottom:-12px;

    transform:rotate(180deg);
}

/* CONTENT */

.content{
    position:relative;

    z-index:3;

    min-height:calc(100vh - 22px);

    padding:
        48px
        25px
        40px;

    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* RINGS */

.rings{
    position:relative;

    width:65px;
    height:38px;

    margin-bottom:18px;
}

.ring{
    position:absolute;

    width:38px;
    height:38px;

    border:2px solid #b58a3e;

    border-radius:50%;
}

.ring.one{
    left:2px;
}

.ring.two{
    right:2px;
}

/* HEART BETWEEN RINGS */

.rings:after{
    content:"♡";

    position:absolute;

    left:50%;
    top:5px;

    transform:translateX(-50%);

    background:#fcfaf4;

    color:#b58a3e;

    font-size:20px;

    line-height:25px;

    padding:0 3px;
}

/* NAMES */

.names{
    margin:0;

    color:#a67d3d;

    font-family:"Great Vibes",cursive;

    font-size:clamp(57px,15vw,82px);

    font-weight:400;

    line-height:.88;

    white-space:nowrap;
}

/* GOLD DIVIDER */

.divider{
    display:flex;

    align-items:center;

    width:215px;

    margin:25px auto 23px;
}

.divider:before,
.divider:after{
    content:"";

    height:1px;

    flex:1;

    background:#c6a66b;
}

.divider span{
    color:#b58a3e;

    margin:0 12px;

    font-size:24px;
}

/* HEADING */

.heading{
    margin:0;

    color:#75644e;

    font-size:clamp(25px,6.5vw,34px);

    font-weight:600;

    letter-spacing:2px;

    line-height:1.08;

    text-transform:uppercase;
}

.heading span{
    display:block;
}

/* INSTRUCTIONS */

.instructions{
    margin-top:25px;

    color:#596853;

    font-size:clamp(21px,5.5vw,28px);

    font-style:italic;

    line-height:1.18;
}

/* COUNTER */

.counter{
    margin-top:19px;

    color:#51483e;

    font-size:27px;

    letter-spacing:2px;
}

.counter .slash{
    color:#b58a3e;
}

/* CAMERA BUTTON */

.camera-button{
    margin-top:18px;

    width:min(390px,88vw);

    min-height:62px;

    border:1px solid #b58a3e;

    border-radius:35px;

    background:#fcfaf4;

    color:#51483e;

    font-family:"Cormorant Garamond",Georgia,serif;

    font-size:23px;

    font-weight:500;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(90,70,40,.08);

    transition:.2s;
}

.camera-button:hover{
    background:#fffdf8;
}

.camera-button:active{
    transform:scale(.98);
}

.camera-button:disabled{
    opacity:.5;
}

/* CAMERA ICON */

.camera-icon{
    color:#b58a3e;

    font-family:Arial,sans-serif;

    font-size:25px;

    margin-right:8px;
}

/* STATUS */

.status{
    min-height:23px;

    margin-top:8px;

    color:#8b7b69;

    font-size:15px;
}

/* PHOTO GRID */

.photos{
    width:min(450px,90vw);

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin-top:19px;
}

/* PHOTO */

.thumb{
    width:100%;

    aspect-ratio:1/1;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #c9ad76;

    background:#faf7ef;
}

/* COMPLETE */

.complete{
    width:min(330px,80vw);

    min-height:56px;

    margin-top:20px;

    border:1px solid #b58a3e;

    border-radius:30px;

    background:#fcfaf4;

    color:#51483e;

    font-family:"Cormorant Garamond",Georgia,serif;

    font-size:22px;

    cursor:pointer;

    box-shadow:0 4px 12px rgba(90,70,40,.06);
}

/* ENGLISH BUTTON */

.language{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    min-width:135px;

    min-height:45px;

    margin-top:23px;

    padding:7px 19px;

    border:1px solid #c5ad80;

    border-radius:25px;

    background:#fcfaf4;

    color:#62594e;

    text-decoration:none;

    font-size:18px;

}

/* FOOTER */

.footer{
    margin-top:22px;

    color:#857b6d;

    font-size:18px;

    font-style:italic;
}

.footer-heart{
    color:#b58a3e;

    font-size:23px;

    margin-bottom:2px;
}

/* SUCCESS */

.success{
    position:relative;

    z-index:4;

    min-height:calc(100vh - 22px);

    padding:
        150px
        25px
        50px;

    text-align:center;
}

.success-heart{
    color:#b58a3e;

    font-size:60px;
}

.success h2{
    margin:15px 0 0;

    color:#a67d3d;

    font-family:"Great Vibes",cursive;

    font-size:65px;

    font-weight:400;
}

.success p{
    color:#596853;

    font-size:23px;

    line-height:1.35;
}

/* HIDDEN */

.hidden{
    display:none !important;
}

/* FLOWERS */

.stem{
    fill:none;

    stroke:#61705c;

    stroke-width:2;

    stroke-linecap:round;
}

.leaf{
    fill:#61705c;
}

.blue{
    fill:#91afd0;
}

.white{
    fill:#fffdf7;

    stroke:#c5a66a;

    stroke-width:1;
}

.center{
    fill:#d1b06c;
}

/* MOBILE */

@media(max-width:600px){

    .page{
        width:calc(100% - 22px);
    }

    .content{
        padding:
            42px
            18px
            35px;
    }

    .botanical{
        width:190px;
        height:190px;
    }

    .names{
        font-size:clamp(54px,15vw,72px);
    }

    .heading{
        font-size:26px;
    }

    .instructions{
        font-size:21px;
    }

    .camera-button{
        width:88vw;
        max-width:360px;
    }

}

/* SHORT PHONES */

@media(max-height:720px){

    .content{
        padding-top:30px;
    }

    .names{
        font-size:60px;
    }

    .divider{
        margin-top:18px;
        margin-bottom:17px;
    }

    .instructions{
        margin-top:17px;
    }

}

</style>
</head>

</p>

<!-- HIDDEN UPLOAD FRAME -->

<iframe
name="uploadFrame"
style="display:none">
</iframe>


<script>

/* ==========================================
   EXISTING WORKING UPLOAD SYSTEM
   DO NOT CHANGE
========================================== */

const MAX_PHOTOS = 10;

const UPLOAD_URL =
"https://script.google.com/macros/s/AKfycbyLTCyFmOyQZnB9gxsT5a3CNIcMtiNmUB-_PMCCJWiDkfVqRqfWYvQ_PrPS1IBV3OlQ/exec";

let photoCount = 0;

let sessionId =
"Guest_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2,8);


function takePhoto(){

    if(photoCount >= MAX_PHOTOS){
        return;
    }

    document
    .getElementById("cameraInput")
    .click();
}


function photoSelected(event){

    const file =
    event.target.files[0];

    if(
        !file ||
        photoCount >= MAX_PHOTOS
    ){
        return;
    }

    setStatus(
        "Επεξεργασία φωτογραφίας..."
    );

    compressImage(
        file,
        function(dataUrl){

            showPhoto(dataUrl);

            uploadPhoto(dataUrl);

        }
    );

    event.target.value = "";
}


function compressImage(
    file,
    callback
){

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        const img =
        new Image();

        img.onload =
        function(){

            let width =
            img.width;

            let height =
            img.height;

            const maxSize =
            1600;

            if(
                width > maxSize ||
                height > maxSize
            ){

                if(width > height){

                    height =
                    Math.round(
                        height *
                        maxSize /
                        width
                    );

                    width =
                    maxSize;

                }else{

                    width =
                    Math.round(
                        width *
                        maxSize /
                        height
                    );

                    height =
                    maxSize;
                }
            }

            const canvas =
            document.createElement(
                "canvas"
            );

            canvas.width =
            width;

            canvas.height =
            height;

            canvas
            .getContext("2d")
            .drawImage(
                img,
                0,
                0,
                width,
                height
            );

            callback(
                canvas.toDataURL(
                    "image/jpeg",
                    0.80
                )
            );
        };

        img.src =
        e.target.result;
    };

    reader.readAsDataURL(file);
}


function showPhoto(dataUrl){

    const img =
    document.createElement("img");

    img.src =
    dataUrl;

    img.className =
    "thumb";

    document
    .getElementById("photos")
    .appendChild(img);
}


function uploadPhoto(dataUrl){

    setStatus(
        "Αποθήκευση φωτογραφίας..."
    );

    const form =
    document.createElement("form");

    form.method =
    "POST";

    form.action =
    UPLOAD_URL;

    form.target =
    "uploadFrame";

    form.style.display =
    "none";


    addField(
        form,
        "photo",
        dataUrl
    );


    addField(
        form,
        "fileName",
        sessionId +
        "_photo_" +
        (photoCount + 1) +
        ".jpg"
    );


    addField(
        form,
        "sessionId",
        sessionId
    );


    document.body.appendChild(
        form
    );


    form.submit();


    form.remove();


    photoCount++;


    updateCounter();


    setStatus(
        "✓ Η φωτογραφία προστέθηκε!"
    );


    if(
        photoCount >= MAX_PHOTOS
    ){

        document
        .getElementById(
            "cameraButton"
        )
        .disabled = true;

        setStatus(
            "✓ Έχετε προσθέσει 10 φωτογραφίες."
        );
    }


    document
    .getElementById(
        "completeButton"
    )
    .classList
    .remove("hidden");
}


function addField(
    form,
    name,
    value
){

    const input =
    document.createElement(
        "input"
    );

    input.type =
    "hidden";

    input.name =
    name;

    input.value =
    value;

    form.appendChild(
        input
    );
}


function updateCounter(){

    document
    .getElementById("count")
    .textContent =
    photoCount;
}


function setStatus(message){

    document
    .getElementById("status")
    .textContent =
    message;
}


function finish(){

    document
    .getElementById("main")
    .classList
    .add("hidden");

    document
    .getElementById("success")
    .classList
    .remove("hidden");
}

</script>
