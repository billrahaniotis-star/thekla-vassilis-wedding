<div class="instruction">Τραβήξτε φωτογραφίες ή βίντεο και μοιραστείτε τις μαζί μας!</div>
<div class="counter"><span id="photoCount">Φωτογραφίες 0 / 10</span><span aria-hidden="true">•</span><span id="videoCount">Βίντεο 0 / 5</span></div>
<div class="actions">
<label class="upload" for="photoCameraInput"><span class="icon"><svg viewBox="0 0 32 32"><rect x="3" y="9" width="26" height="19" rx="3"/><path d="M10 9l2.4-4h7.2L22 9"/><circle cx="16" cy="18.5" r="5"/></svg></span>Τραβήξτε φωτογραφίες</label>
<input id="photoCameraInput" type="file" accept="image/*" capture="environment">
<label class="upload" for="videoCameraInput"><span class="icon"><svg viewBox="0 0 32 32"><rect x="3" y="7" width="19" height="18" rx="3"/><path d="M22 13l7-4v14l-7-4z"/></svg></span>Τραβήξτε βίντεο</label>
<input id="videoCameraInput" type="file" accept="video/*" capture="environment">
<label class="upload" for="photoInput"><span class="icon"><svg viewBox="0 0 32 32"><rect x="3" y="9" width="26" height="19" rx="3"/><path d="M10 9l2.4-4h7.2L22 9"/><circle cx="16" cy="18.5" r="5"/></svg></span>Επιλέξτε φωτογραφίες από τη συλλογή</label>
<input id="photoInput" type="file" accept="image/*" multiple>
<label class="upload" for="videoInput"><span class="icon"><svg viewBox="0 0 32 32"><rect x="3" y="7" width="19" height="18" rx="3"/><path d="M22 13l7-4v14l-7-4z"/></svg></span>Επιλέξτε βίντεο από τη συλλογή</label>
<input id="videoInput" type="file" accept="video/*"></div>
<div id="status" class="status"></div>
<button id="sendButton" class="send" type="button">ΜΕΤΑΦΟΡΤΩΣΗ</button>
<script>
/* Photo + video upload: videos are converted to a data URL and sent to the Apps Script doPost endpoint. */
const ENDPOINT="https://script.google.com/macros/s/AKfycbyLTCyFmOyQZnB9gxsT5a3CNIcMtiNmUB-_PMCCJWiDkfVqRqfWYvQ_PrPS1IBV3OlQ/exec";
const MAX_PHOTOS=10,MAX_VIDEOS=5;
const sessionId="Guest_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
const items=[];
const status=document.getElementById("status"),photoCount=document.getElementById("photoCount"),videoCount=document.getElementById("videoCount");
const sendButton=document.getElementById("sendButton");

function render(){
  const photos=items.filter(x=>x.type==="photo"&&!x.sent).length;
  const videos=items.filter(x=>x.type==="video"&&!x.sent).length;
  photoCount.textContent="Φωτογραφίες "+photos+" / "+MAX_PHOTOS;
  videoCount.textContent="Βίντεο "+videos+" / "+MAX_VIDEOS;
  sendButton.disabled=items.filter(x=>!x.sent).length===0;
}

function addFiles(fileList,type){
  const files=Array.from(fileList||[]);
  if(!files.length){
    // On iPhone, picking a video from the photo library (as opposed to
    // recording one fresh) can silently come back empty if the video needs
    // to be downloaded from iCloud or converted first — let the guest know
    // rather than leaving them wondering why the counter didn't move.
    if(type==="video"){
      status.textContent="That video couldn't be added — please try selecting it again.";
    }
    return;
  }

  // Cap against how many of this type are already pending (not yet uploaded).
  const max=type==="photo"?MAX_PHOTOS:MAX_VIDEOS;
  const already=items.filter(x=>x.type===type&&!x.sent).length;
  const remaining=Math.max(0,max-already);
  const selected=files.slice(0,remaining);

  for(const file of selected){
    if(type==="video"&&file.size>20*1024*1024){
      status.textContent="Please select videos up to 20 MB.";
      continue;
    }
    items.push({type,file,url:URL.createObjectURL(file),sent:false});
  }

  if(files.length>remaining){
    status.textContent=type==="photo"
      ?"You can select up to 10 photos at a time."
      :"You can select up to 5 videos at a time.";
  }else{
    status.textContent="Ready to upload ♡";
  }
  render();
}

function compressPhoto(file){return new Promise((resolve,reject)=>{
  const r=new FileReader(),img=new Image();
  r.onload=()=>{img.onload=()=>{
    let w=img.naturalWidth,h=img.naturalHeight,m=1600,s=Math.min(1,m/Math.max(w,h));
    w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    resolve(c.toDataURL("image/jpeg",.8));
  };img.onerror=reject;img.src=r.result};
  r.onerror=reject;r.readAsDataURL(file);
})}

async function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error||new Error("FileReader error"));
    r.readAsDataURL(file);
  });
}

async function sendAll(){
  const pending=items.filter(x=>!x.sent);
  if(!pending.length){
    status.textContent="All selected files have already been uploaded ♡";
    return;
  }

  const oversized=pending.find(item=>item.type==="video" && item.file.size>20*1024*1024);
  if(oversized){
    status.textContent="One of the videos is larger than 20 MB.";
    return;
  }

  // Move this batch out of the picker and show the thank-you message right
  // away — the guest shouldn't have to wait around watching a progress bar.
  // The actual upload keeps running quietly in the background.
  for(let i=items.length-1;i>=0;i--){
    if(!items[i].sent) items.splice(i,1);
  }
  for(const item of pending){
    if(item.url) URL.revokeObjectURL(item.url);
  }
  render();
  status.textContent="";

  const thankyou=document.getElementById("thankyou");
  if(thankyou) thankyou.classList.add("show");

  uploadInBackground(pending);
}

async function uploadInBackground(pending){
  for(const item of pending){
    try{
      let dataUrl;
      if(item.type==="photo"){
        dataUrl=await compressPhoto(item.file);
      }else{
        dataUrl=await fileToDataUrl(item.file);
      }

      const body=new URLSearchParams();
      body.append("dataUrl",dataUrl);
      body.append("fileName",item.file.name);
      body.append("sessionId",sessionId);
      body.append("type",item.type);

      await sendWithRetry(body);
      item.sent=true;
    }catch(e){
      // The guest has already moved on to the thank-you screen, so upload
      // errors aren't surfaced here — the file is simply skipped after
      // retrying a few times (see sendWithRetry).
    }
  }
}

// Retries a transient network failure (e.g. a brief connectivity drop at the
// venue) a few times with a short backoff before giving up on this file.
function sendWithRetry(body, attempts=3, delays=[1000,3000,8000]){
  return new Promise((resolve,reject)=>{
    const attempt=(n)=>{
      fetch(ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body:body.toString(),
        mode:"no-cors"
      }).then(resolve).catch(err=>{
        if(n>=attempts-1){ reject(err); return; }
        setTimeout(()=>attempt(n+1), delays[n] || delays[delays.length-1]);
      });
    };
    attempt(0);
  });
}

document.getElementById("photoCameraInput").onchange=e=>{addFiles(e.target.files,"photo");e.target.value=""};
document.getElementById("photoInput").onchange=e=>{addFiles(e.target.files,"photo");e.target.value=""};
document.getElementById("videoCameraInput").onchange=e=>{addFiles(e.target.files,"video");e.target.value=""};
document.getElementById("videoInput").onchange=e=>{addFiles(e.target.files,"video");e.target.value=""};
sendButton.onclick=sendAll;
const thankyouClose=document.getElementById("thankyouClose");
if(thankyouClose) thankyouClose.onclick=()=>{
  const thankyou=document.getElementById("thankyou");
  if(thankyou) thankyou.classList.remove("show");
};
render();
</script></div>
</body></html>
