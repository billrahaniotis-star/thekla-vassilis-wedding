<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thekla & Vassilis Wedding</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>

    /* =====================================================
       BASE
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #f5f1e8;

      color: #514b44;

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* =====================================================
       MAIN INVITATION
    ===================================================== */

    .invitation {
      position: relative;

      width: calc(100% - 28px);
      max-width: 500px;

      min-height: calc(100vh - 28px);

      margin: 14px auto;

      padding:
        42px
        30px
        36px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.55),
          rgba(255,255,255,.15)
        ),
        #fbf9f3;

      border: 1px solid #b5965c;

      overflow: hidden;
    }


    /* Inner fine frame */

    .invitation::before {
      content: "";

      position: absolute;

      inset: 8px;

      border: 1px solid rgba(181,150,92,.35);

      pointer-events: none;
    }


    /* =====================================================
       CORNER BOTANICAL LINE ART
    ===================================================== */

    .corner {
      position: absolute;

      width: 75px;
      height: 100px;

      opacity: .30;

      pointer-events: none;
    }

    .corner::before,
    .corner::after {
      content: "";

      position: absolute;

      border: 1px solid #78816e;

      border-radius: 100% 0 100% 0;
    }

    .corner::before {
      width: 34px;
      height: 17px;

      transform: rotate(-35deg);
    }

    .corner::after {
      width: 28px;
      height: 15px;

      transform: rotate(25deg);
    }

    .corner.top-left {
      top: 24px;
      left: 20px;
    }

    .corner.top-left::before {
      top: 15px;
      left: 8px;
    }

    .corner.top-left::after {
      top: 36px;
      left: 25px;
    }

    .corner.bottom-right {
      right: 20px;
      bottom: 24px;

      transform: rotate(180deg);
    }

    .corner.bottom-right::before {
      top: 15px;
      left: 8px;
    }

    .corner.bottom-right::after {
      top: 36px;
      left: 25px;
    }


    /* =====================================================
       CONTENT
    ===================================================== */

    .content {
      position: relative;
      z-index: 2;

      text-align: center;
    }


    /* =====================================================
       TOP HEART
    ===================================================== */

    .top-heart {
      font-family: Georgia, serif;

      font-size: 25px;

      font-weight: 400;

      color: #a8864d;

      margin-bottom: 17px;
    }


    /* =====================================================
       NAMES
    ===================================================== */

    .names {
      margin: 0;

      font-family:
        "Great Vibes",
        cursive;

      font-size:
        clamp(60px, 16vw, 82px);

      font-weight: 400;

      line-height: .82;

      letter-spacing: .5px;

      color: #a37d3e;
    }


    /* =====================================================
       WEDDING
    ===================================================== */

    .wedding {
      margin-top: 23px;

      font-size: 14px;

      letter-spacing: 8px;

      color: #5b554e;

      font-weight: 500;
    }


    /* =====================================================
       GOLD ORNAMENT
    ===================================================== */

    .ornament {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      margin: 22px auto 24px;

      width: 150px;
    }

    .ornament::before,
    .ornament::after {
      content: "";

      height: 1px;

      flex: 1;

      background: #b5965c;
    }

    .ornament span {
      font-size: 12px;

      color: #a8864d;
    }


    /* =====================================================
       GREEK TITLE
    ===================================================== */

    .greek-title {
      margin: 0 auto;

      max-width: 390px;

      color: #665f57;

      font-size:
        clamp(28px, 7vw, 36px);

      font-weight: 500;

      line-height: 1.05;

      letter-spacing: .2px;
    }

    .greek-title strong {
      color: #9d793e;

      font-weight: 600;
    }


    /* =====================================================
       SMALL DECORATIVE HEART
    ===================================================== */

    .small-heart {
      margin: 23px auto 25px;

      color: #a8864d;

      font-size: 18px;
    }


    /* =====================================================
       MOMENTS
    ===================================================== */

    .moments {
      margin: 0;

      font-size:
        clamp(27px, 7vw, 34px);

      font-style: italic;

      font-weight: 400;

      color: #514b44;

      line-height: 1.05;
    }

    .moments-greek {
      margin-top: 4px;

      font-size:
        clamp(25px, 6.5vw, 32px);

      font-style: italic;

      color: #514b44;

      line-height: 1.05;
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
      max-width: 350px;

      margin: 22px auto 0;

      font-size: 17px;

      line-height: 1.25;

      color: #706961;
    }


    /* =====================================================
       LANGUAGE LABEL
    ===================================================== */

    .choose {
      margin-top: 29px;

      font-size: 11px;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #80776e;
    }

    .choose-greek {
      margin-top: 6px;

      font-size: 14px;

      letter-spacing: 2px;

      color: #80776e;
    }


    /* =====================================================
       LANGUAGE BUTTONS
    ===================================================== */

    .languages {
      width: 100%;

      max-width: 360px;

      margin: 19px auto 0;

      display: flex;

      flex-direction: column;

      gap: 13px;
    }


    .language {
      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

      height: 56px;

      border: 1px solid #b5965c;

      border-radius: 999px;

      background: rgba(255,255,255,.42);

      color: #554e47;

      text-decoration: none;

      font-size: 21px;

      font-weight: 500;

      letter-spacing: .5px;

      transition:
        background .25s ease,
        transform .2s ease;
    }


    .language:hover {
      background: #fffdf8;
    }


    .language:active {
      transform: scale(.985);
    }


    .flag {
      position: absolute;

      left: 19px;

      display: flex;

      align-items: center;

      font-size: 20px;
    }


    .arrow {
      position: absolute;

      right: 20px;

      color: #a8864d;

      font-family: Georgia, serif;

      font-size: 23px;

      line-height: 1;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
      margin-top: 29px;

      font-size: 15px;

      font-style: italic;

      line-height: 1.2;

      color: #8a8177;
    }

    .footer-heart {
      margin-bottom: 5px;

      color: #a8864d;

      font-size: 17px;
    }


    /* =====================================================
       SMALL PHONES
    ===================================================== */

    @media (max-height: 740px) {

      .invitation {
        padding-top: 31px;
        padding-bottom: 27px;
      }

      .top-heart {
        margin-bottom: 12px;
      }

      .names {
        font-size: 60px;
      }

      .wedding {
        margin-top: 18px;
      }

      .ornament {
        margin-top: 18px;
        margin-bottom: 19px;
      }

      .greek-title {
        font-size: 28px;
      }

      .small-heart {
        margin: 18px auto;
      }

      .moments {
        font-size: 27px;
      }

      .moments-greek {
        font-size: 25px;
      }

      .message {
        margin-top: 17px;
        font-size: 16px;
      }

      .choose {
        margin-top: 22px;
      }

      .footer {
        margin-top: 21px;
      }
    }


    /* =====================================================
       VERY SMALL SCREENS
    ===================================================== */

    @media (max-width: 360px) {

      .invitation {
        width: calc(100% - 18px);

        margin: 9px auto;

        min-height: calc(100vh - 18px);

        padding-left: 22px;
        padding-right: 22px;
      }

      .names {
        font-size: 56px;
      }

      .greek-title {
        font-size: 26px;
      }

      .message {
        max-width: 310px;
      }

      .language {
        height: 53px;
      }
    }

  </style>
</head>


<body>

  <main class="invitation">

    <!-- Subtle botanical corners -->
    <div class="corner top-left"></div>
    <div class="corner bottom-right"></div>


    <div class="content">


      <!-- Top -->

      <div class="top-heart">♡</div>


      <!-- Names -->

      <h1 class="names">
        Thekla &amp; Vassilis
      </h1>


      <!-- Wedding -->

      <div class="wedding">
        W E D D I N G
      </div>


      <!-- Divider -->

      <div class="ornament">
        <span>♡</span>
      </div>


      <!-- Greek -->

      <div class="greek-title">

        <strong>Ο γάμος της Θέκλας</strong><br>

        και του Βασίλη

      </div>


      <!-- Small ornament -->

      <div class="small-heart">
        ♡
      </div>


      <!-- Moments -->

      <div class="moments">
        Our beautiful moments
      </div>

      <div class="moments-greek">
        Οι όμορφες στιγμές μας
      </div>


      <!-- Message -->

      <div class="message">

        Help us capture the moments<br>
        we will cherish forever.

      </div>


      <!-- Language -->

      <div class="choose">
        Choose your language
      </div>

      <div class="choose-greek">
        Επιλέξτε γλώσσα
      </div>


      <!-- Buttons -->

      <div class="languages">


        <a
          class="language"
          href="./index-gr.html"
          aria-label="Ελληνικά"
        >

          <span class="flag">🇬🇷</span>

          Ελληνικά

          <span class="arrow">›</span>

        </a>


        <a
          class="language"
          href="./en.html"
          aria-label="English"
        >

          <span class="flag">🇬🇧</span>

          English

          <span class="arrow">›</span>

        </a>


      </div>


      <!-- Footer -->

      <div class="footer">

        <div class="footer-heart">
          ♡
        </div>

        With love, Thekla &amp; Vassilis

      </div>


    </div>

  </main>

</body>
</html>
