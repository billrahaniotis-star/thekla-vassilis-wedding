<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Βασίλης και Θέκλα</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f8f3e7;
  min-height: 100%;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.wedding-page {
  position: relative;
  width: 100%;
  max-width: 1024px;
  line-height: 0;
}

.wedding-page img {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}

/* Greek button */
.language-link.greek {
  position: absolute;
  left: 22.3%;
  top: 59.15%;
  width: 55.5%;
  height: 8.1%;
  display: block;
  border-radius: 40px;
  text-decoration: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

/* English button */
.language-link.english {
  position: absolute;
  left: 22.3%;
  top: 69.15%;
  width: 55.5%;
  height: 8.1%;
  display: block;
  border-radius: 40px;
  text-decoration: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

/* Keyboard accessibility */
.language-link:focus-visible {
  box-shadow: 0 0 0 3px rgba(181,138,62,.55);
}

@media (max-width: 600px) {

  .language-link.greek,
  .language-link.english {
    border-radius: 28px;
  }

}
</style>
</head>

<body>

<main
  class="wedding-page"
  aria-label="Βασίλης και Θέκλα — επιλογή γλώσσας"
>

  <!-- Approved wedding landing-page design -->
  <img
    src="./index-design.png"
    alt="Βασίλης και Θέκλα — Οι όμορφες στιγμές μας από τα μάτια σας"
  >

  <!-- Greek button -->
  <a
    class="language-link greek"
    href="./index-gr.html"
    aria-label="Ελληνικά"
  ></a>

  <!-- English button -->
  <a
    class="language-link english"
    href="./en.html"
    aria-label="English"
  ></a>

</main>

</body>
</html>
