<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thekla & Vassilis Wedding</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(135deg, #fffaf7, #f8eee8);
      color: #4a3932;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 45px 25px;
      text-align: center;
      background: rgba(255,255,255,0.94);
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(80,50,40,0.12);
    }

    .heart {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      font-weight: normal;
    }

    .subtitle {
      font-size: 19px;
      margin-bottom: 35px;
      color: #80675d;
    }

    .message {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    a {
      display: block;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      background: #f3e2da;
      color: #4a3932;
      transition: transform 0.15s;
    }

    a:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 30px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #9a8880;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">🤍</div>

    <h1>Ο γάμος της Θέκλας και του Βασίλη</h1>

    <div class="subtitle">
      Οι όμορφες στιγμές μας
    </div>

    <div class="message">
      Μοιραστείτε μαζί μας τις όμορφες στιγμές του γάμου μας!<br><br>
      Please choose your language to continue.
    </div>

    <div class="buttons">
      <a href="./index-gr.html">
        🇬🇷 Ελληνικά
      </a>

      <a href="./en.html">
        🇬🇧 English
      </a>
    </div>

    <div class="footer">
      Thank you for celebrating with us 🤍
    </div>

  </div>

</body>
</html>
