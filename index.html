<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Βασίλης και Θέκλα</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #f7f1e5;
    color: #51483e;
    font-family: "Cormorant Garamond", Georgia, serif;
}

/* MAIN PAGE */

.page {
    position: relative;
    width: calc(100% - 22px);
    max-width: 600px;
    min-height: calc(100vh - 22px);
    margin: 11px auto;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255,255,255,.85),
            rgba(255,255,255,0) 50%
        ),
        #fcfaf4;

    border: 1px solid #b9985d;

    overflow: hidden;
}

/* INNER GOLD BORDER */

.page::before {
    content: "";
    position: absolute;
    inset: 7px;

    border: 1px solid rgba(185,152,93,.55);

    pointer-events: none;
}

/* CONTENT */

.content {
    position: relative;
    z-index: 5;

    min-height: calc(100vh - 22px);

    padding:
        48px
        30px
        40px;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* BOTANICAL CORNERS */

.botanical {
    position: absolute;
    z-index: 2;

    width: 210px;
    height: 210px;

    pointer-events: none;
}

.botanical.top-left {
    top: -15px;
    left: -20px;
}

.botanical.bottom-right {
    right: -20px;
    bottom: -15px;
    transform: rotate(180deg);
}

/* RINGS */

.rings {
    position: relative;
    margin-top: 3px;
    margin-bottom: 17px;

    width: 54px;
    height: 30px;
}

.ring {
    position: absolute;

    width: 30px;
    height: 30px;

    border: 2px solid #b9985d;
    border-radius: 50%;
}

.ring.one {
    left: 3px;
}

.ring.two {
    right: 3px;
}

/* HEART */

.rings::after {
    content: "♡";

    position: absolute;

    left: 50%;
    top: 4px;

    transform: translateX(-50%);

    color: #b9985d;
    background: #fcfaf4;

    padding: 0 3px;

    font-size: 18px;
    line-height: 20px;
}

/* NAMES */

.names {
    margin: 0;

    color: #a98245;

    font-family: "Great Vibes", cursive;

    font-size: clamp(58px, 15vw, 82px);

    font-weight: 400;

    line-height: .85;

    white-space: nowrap;
}

/* GOLD DIVIDER */

.divider {
    display: flex;
    align-items: center;

    width: 210px;

    margin: 27px auto 25px;

    color: #b9985d;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    flex: 1;

    background: #c9aa72;
}

.divider span {
    margin: 0 12px;

    font-size: 20px;
}

/* MAIN ENGLISH TEXT */

.english-title {
    margin: 0;

    color: #9d7b46;

    font-family: "Cormorant Garamond", Georgia, serif;

    font-size: clamp(25px, 6.5vw, 36px);

    font-weight: 600;

    letter-spacing: 1px;

    line-height: 1.05;

    text-transform: uppercase;
}

.english-subtitle {
    margin-top: 5px;

    color: #51483e;

    font-size: clamp(22px, 5.7vw, 30px);

    letter-spacing: 1px;

    line-height: 1.05;

    text-transform: uppercase;
}

/* GREEK TEXT */

.greek-title {
    margin-top: 19px;

    color: #64745e;

    font-size: clamp(20px, 5vw, 27px);

    font-style: italic;

    line-height: 1.1;
}

/* LANGUAGE TITLE */

.choose-language {
    margin-top: 30px;

    color: #8c8171;

    font-family: "Cormorant Garamond", Georgia, serif;

    font-size: 14px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

/* LANGUAGE BUTTONS */

.language-buttons {
    width: min(360px, 100%);

    display: flex;
    flex-direction: column;

    gap: 13px;

    margin-top: 13px;
}

.language-button {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 57px;

    border: 1px solid #b9985d;

    border-radius: 32px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.85),
            rgba(249,243,231,.75)
        );

    color: #51483e;

    text-decoration: none;

    font-family: "Cormorant Garamond", Georgia, serif;

    font-size: 22px;

    font-weight: 500;

    box-shadow:
        0 3px 10px rgba(80,60,40,.06);

    transition:
        transform .2s ease,
        background .2s ease;
}

.language-button:hover {
    transform: translateY(-1px);

    background: #fffdf8;
}

.language-button:active {
    transform: scale(.985);
}

.flag {
    position: absolute;

    left: 20px;

    font-family: Arial, sans-serif;

    font-size: 20px;
}

.arrow {
    position: absolute;

    right: 20px;

    color: #b9985d;

    font-family: Arial, sans-serif;

    font-size: 28px;

    line-height: 1;
}

/* FOOTER */

.footer {
    margin-top: 25px;

    color: #918675;

    font-size: 16px;

    font-style: italic;
}

.footer-heart {
    color: #b9985d;

    font-size: 19px;

    margin-bottom: 3px;
}

/* MOBILE */

@media (max-width: 600px) {

    .content {
        padding:
            43px
            23px
            32px;
    }

    .botanical {
        width: 175px;
        height: 175px;
    }

    .names {
        font-size: clamp(55px, 16vw, 72px);
    }

    .english-title {
        font-size: 27px;
    }

    .english-subtitle {
        font-size: 23px;
    }

    .greek-title {
        font-size: 21px;
    }

    .choose-language {
        margin-top: 25px;
    }

    .language-button {
        height: 55px;
    }
}

/* SHORT PHONE SCREENS */

@media (max-height: 700px) {

    .content {
        padding-top: 32px;
        padding-bottom: 25px;
    }

    .rings {
        margin-bottom: 12px;
    }

    .divider {
        margin-top: 19px;
        margin-bottom: 18px;
    }

    .greek-title {
        margin-top: 13px;
    }

    .choose-language {
        margin-top: 20px;
    }

    .footer {
        margin-top: 16px;
    }
}

</style>
</head>
