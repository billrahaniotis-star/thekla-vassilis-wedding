const items=[];
const photoGallery=document.getElementById("photoGallery"),videoGallery=document.getElementById("videoGallery");
const status=document.getElementById("status"),photoCount=document.getElementById("photoCount"),videoCount=document.getElementById("videoCount");
const sendButton=document.getElementById("sendButton");

function makeSlot(item){
  const s=document.createElement("div");s.className="slot";
  if(item){
    if(item.type==="video"){
      const v=document.createElement("video");v.src=item.url;v.muted=true;v.playsInline=true;s.appendChild(v);
      const p=document.createElement("span");p.className="play";p.textContent="▶";s.appendChild(p);
    }else{
      const im=document.createElement("img");im.src=item.url;s.appendChild(im);
    }
  }
  return s;
}
function render(){
  photoGallery.innerHTML="";videoGallery.innerHTML="";
  const photos=items.filter(x=>x.type==="photo"),videos=items.filter(x=>x.type==="video");
  photoCount.textContent="Photos "+photos.length+" / "+MAX_PHOTOS;
  videoCount.textContent="Videos "+videos.length+" / "+MAX_VIDEOS;
  for(let i=0;i<MAX_PHOTOS;i++)photoGallery.appendChild(makeSlot(photos[i]));
  for(let i=0;i<MAX_VIDEOS;i++)videoGallery.appendChild(makeSlot(videos[i]));
  sendButton.disabled=items.length===0;
}

function addFiles(fileList,type){
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  const max=type==="photo"?MAX_PHOTOS:MAX_VIDEOS;
  const existing=items.filter(x=>x.type===type).length;
  const remaining=max-existing;
  if(remaining<=0){
    status.textContent=type==="photo"?"Έχετε φτάσει το όριο των 10 φωτογραφιών.":"Έχετε φτάσει το όριο των 5 βίντεο.";
    return;
  }
  const selected=files.slice(0,remaining);
  for(const file of selected){
    if(type==="video"&&file.size>20*1024*1024){
      status.textContent="Παρακαλώ επιλέξτε βίντεο έως 20 MB.";
      continue;
    }
    items.push({type,file,url:URL.createObjectURL(file),sent:false});
  }
  if(files.length>remaining)status.textContent=type==="photo"?"Μπορείτε να προσθέσετε έως 10 φωτογραφίες συνολικά.":"Μπορείτε να προσθέσετε έως 5 βίντεο συνολικά.";
  else status.textContent="Έτοιμο για αποστολή ♡";
  render();
}

function compressPhoto(file){return new Promise((resolve,reject)=>{
  const r=new FileReader(),img=new Image();
  r.onload=()=>{img.onload=()=>{
    let w=img.naturalWidth,h=img.naturalHeight,m=1600,s=Math.min(1,m/Math.max(w,h));
    w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    resolve(c.toDataURL("image/jpeg",.8));
  };img.onerror=reject;img.src=r.result};
  r.onerror=reject;r.readAsDataURL(file);
})}

async function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error||new Error("FileReader error"));
    r.readAsDataURL(file);
  });
}

async function sendAll(){
  const pending=items.filter(x=>!x.sent);
  if(!pending.length){
    status.textContent="Όλα έχουν ήδη σταλεί ♡";
    return;
  }

  sendButton.disabled=true;
  let sent=0;

  for(const item of pending){
    try{
      if(item.type==="video" && item.file.size>20*1024*1024){
        throw new Error("Video is larger than 20 MB.");
      }

      status.textContent=`Upload ${sent+1} / ${pending.length}…`;

      let dataUrl;
      if(item.type==="photo"){
        dataUrl=await compressPhoto(item.file);
      }else{
        dataUrl=await fileToDataUrl(item.file);
      }

      const body=new URLSearchParams();
      body.append("dataUrl",dataUrl);
      body.append("fileName",item.file.name);
      body.append("sessionId",sessionId);
      body.append("type",item.type);

      await fetch(ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body:body.toString(),
        mode:"no-cors"
      });

      item.sent=true;
      sent++;
      status.textContent=`Upload ${sent} / ${pending.length}…`;
    }catch(e){
      status.textContent=e.message==="Video is larger than 20 MB."
        ?"Ένα από τα βίντεο είναι μεγαλύτερο από 20 MB."
        :"Δεν ήταν δυνατή η ολοκλήρωση της αποστολής. Παρακαλώ δοκιμάστε ξανά.";
      sendButton.disabled=false;
      return;
    }
  }

  status.textContent="Η αποστολή ολοκληρώθηκε ♡";

  const thankyou=document.getElementById("thankyou");
  if(thankyou) thankyou.classList.add("show");

  sendButton.disabled=false;
}

document.getElementById("photoInput").onchange=e=>{addFiles(e.target.files,"photo");e.target.value=""};
document.getElementById("videoInput").onchange=e=>{addFiles(e.target.files,"video");e.target.value=""};
sendButton.onclick=sendAll;
render();
</script></div>
</body></html>
